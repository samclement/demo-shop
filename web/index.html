<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>demo-shop</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 0;
        padding: 2rem 1rem;
        color: #1f2328;
        background: #f6f8fa;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 1.5rem;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      dt {
        font-weight: 600;
      }
      dd {
        margin: 0 0 0.75rem;
      }
      .muted {
        color: #59636e;
      }
      ul {
        padding-left: 1.25rem;
      }
      form {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 1rem;
      }
      select,
      input,
      button {
        font: inherit;
        padding: 0.25rem 0.5rem;
      }
      input {
        width: 5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>demo-shop</h1>
      <p class="muted">Signed in as <span id="who">…</span></p>
      <form id="buy">
        <label
          >Item
          <select id="item"></select
        ></label>
        <label>Quantity <input id="quantity" type="number" min="1" max="1000" value="1" /></label>
        <button type="submit">Buy</button>
        <span id="said" class="muted" role="status"></span>
      </form>
      <h2>Your recent purchases</h2>
      <ul id="yours">
        <li class="muted">…</li>
      </ul>
      <h2>Latest orders</h2>
      <ul id="orders">
        <li class="muted">…</li>
      </ul>
      <p class="muted">
        Orders live in demo-orders; this shop keeps its own log of what was bought through it. Ten
        or more of something makes demo-notifier tell the team.
      </p>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
